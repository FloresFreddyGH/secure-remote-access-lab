<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 610"><rect width="1100" height="610" rx="20" fill="#101e35"/><g font-family="Arial,sans-serif"><text x="45" y="65" font-size="34" fill="#fff8ec" font-weight="bold">Two paths. Two different jobs.</text><text x="45" y="112" font-size="22" fill="#56f0d0">DESKTOP CONTROL · host must be running</text><g fill="#214a68" stroke="#56f0d0" stroke-width="2"><rect x="45" y="145" width="260" height="105" rx="12"/><rect x="420" y="145" width="260" height="105" rx="12"/><rect x="795" y="145" width="260" height="105" rx="12"/></g><g fill="#fff8ec" font-size="25" text-anchor="middle"><text x="175" y="190">Windows laptop</text><text x="550" y="190">Tailscale</text><text x="925" y="190">Ubuntu + NoMachine</text></g><g fill="#d5e2ef" font-size="19" text-anchor="middle"><text x="175" y="224">Keyboard, mouse, audio</text><text x="550" y="224">Private connectivity</text><text x="925" y="224">Existing desktop session</text></g><path d="M320 195H400M695 195H775" stroke="#56f0d0" stroke-width="5"/><text x="45" y="330" font-size="22" fill="#ffe174">REMOTE WAKE · cellular test passed, from suspend</text><g fill="#214a68" stroke="#ffe174" stroke-width="2" ><rect x="45" y="365" width="260" height="105" rx="12"/><rect x="420" y="365" width="260" height="105" rx="12"/><rect x="795" y="365" width="260" height="105" rx="12"/></g><g fill="#fff8ec" font-size="25" text-anchor="middle"><text x="175" y="410">Laptop via Tailscale</text><text x="550" y="410">Home wake relay</text><text x="925" y="410">Ubuntu resumes</text></g><g fill="#d5e2ef" font-size="19" text-anchor="middle"><text x="175" y="445">Request from outside home</text><text x="550" y="445">HP relay stays awake</text><text x="925" y="445">Then connect to NoMachine</text></g><path d="M320 415H400M695 415H775" stroke="#ffe174" stroke-width="5" /><text x="45" y="545" fill="#d5e2ef" font-size="23">The relay sends the wake packet locally. The sleeping desktop cannot run Tailscale.</text></g></svg>